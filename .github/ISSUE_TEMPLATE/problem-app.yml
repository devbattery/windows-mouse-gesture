name: 문제 앱 보고
description: 특정 앱에서 우클릭·제스처가 이상하게 동작할 때
title: "[문제 앱] "
body:
  - type: markdown
    attributes:
      value: |
        보안 문제는 이 양식 대신 SECURITY.md의 방법으로 알려 주세요.
        설정 창 → **일상 사용 점검** → **진단 정보 복사**로 만든 내용을 붙여 넣으면 원인을 찾기 쉽습니다.
        앱 이름은 체크했을 때만 들어가고, 좌표·창 제목은 들어가지 않습니다.
  - type: input
    id: app
    attributes:
      label: 앱
      description: 앱 이름과 실행 파일 이름(예. 메모장, notepad.exe)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 일어났나요?
      description: 무엇을 했고(예. 우클릭, 오른쪽 드래그로 ↓), 무엇을 기대했고, 실제로 어떻게 됐는지
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 진단 정보
      description: 설정 창의 "진단 정보 복사" 결과
      render: text
  - type: input
    id: version
    attributes:
      label: Glide 버전과 Windows 버전
      description: 진단 정보를 붙였다면 비워 두어도 됩니다
