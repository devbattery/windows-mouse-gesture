# main에 push하거나 PR을 열 때 로컬과 같은 검사를 하고, 설치 패키지까지 만들어 본다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # 외부 Action은 태그가 바뀌어도 같은 코드가 실행되도록 커밋 SHA로 고정한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust 도구 준비
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      # 의존성·빌드 결과·~/.cargo/bin을 캐시해 두 번째 실행부터 빌드 시간을 줄인다.
      # 캐시 저장은 main push에서만 한다(PR이 만든 캐시가 다른 실행에 쓰이지 않게). 릴리스 작업은 캐시를 쓰지 않는다.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # 라이선스 고지 생성 도구. 캐시에 같은 버전이 있으면 cargo가 설치를 건너뛴다.
      - name: 라이선스 고지 도구 설치
        run: cargo install cargo-about --version 0.9.3 --locked --features cli

      - name: 서식 검사
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 테스트
        run: cargo test --workspace --locked

      - name: 설정 창 스크립트 구문 검사
        run: |
          foreach ($file in Get-ChildItem settings/ui/*.js) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: 설치 패키지 만들기(uiAccess 매니페스트 확인 포함)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1

      # 설치 프로그램 컴파일러. 러너 이미지에는 Inno Setup 6만 있어 고정한 7.1.1을 받아 SHA-256을 확인한 뒤 설치한다.
      - name: Inno Setup 7 설치
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/install-inno-setup.ps1

      - name: 설치 프로그램 만들기
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-installer.ps1

      # 러너에 실제로 설치·다시 설치·제거를 해 보고 인증서·등록·자동 시작이 맞게 정리되는지 확인한다.
      - name: 설치 프로그램 확인(설치·업데이트·제거)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/test-installer.ps1

      - name: 설치 로그 올리기(실패했을 때)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-test-logs
          path: dist/installer-test-logs/
          if-no-files-found: ignore
