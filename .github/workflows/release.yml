# v<버전> 태그를 push하면 검사 → 패키지 → (설정돼 있으면) SignPath 코드 서명 → zip·SHA256SUMS → GitHub Release.
# SignPath 단계는 저장소 변수 SIGNPATH_ORGANIZATION_ID가 있을 때만 실행한다(docs/signing.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # Release 만들기
  actions: read # SignPath가 이 실행의 artifact를 읽음

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 태그와 Cargo.toml 버전 확인
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "태그($env:GITHUB_REF_NAME)와 Cargo.toml 버전(v$version)이 다릅니다." }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Rust 도구 준비
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      # 단계를 나눠 두면 로그를 열지 않아도 어느 검사가 실패했는지 단계 이름으로 보인다.
      - name: 서식 검사
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 테스트
        run: cargo test --workspace --locked

      - name: 설치 패키지 만들기
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1

      - name: 서명할 실행 파일 올리기
        id: unsigned
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-bin
          path: dist/glide-windows-${{ env.VERSION }}/bin/
          if-no-files-found: error

      - name: SignPath 코드 서명
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-bin

      - name: 서명된 실행 파일로 바꾸기
        if: env.SIGNPATH_ENABLED == 'true'
        run: |
          $bin = "dist/glide-windows-$env:VERSION/bin"
          foreach ($name in 'glide-core.exe', 'glide-core-uiaccess.exe', 'glide-settings.exe') {
            $signed = Join-Path 'signed-bin' $name
            $status = (Get-AuthenticodeSignature -LiteralPath $signed).Status
            if ($status -ne 'Valid') { throw "$name 서명 상태가 올바르지 않습니다: $status" }
            Copy-Item -LiteralPath $signed -Destination (Join-Path $bin $name) -Force
          }

      - name: zip·SHA256SUMS 만들기
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/archive.ps1

      - name: 릴리스 노트 만들기
        run: |
          $changelog = Get-Content -Raw -Encoding utf8 CHANGELOG.md
          $pattern = "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) { throw "CHANGELOG.md에 $env:VERSION 절이 없습니다." }
          $signing = if ($env:SIGNPATH_ENABLED -eq 'true') {
            'SignPath Foundation 인증서로 서명(SignPath.io 무료 코드 서명)'
          } else {
            '서명 없음. install.cmd가 설치할 때 이 PC 전용 인증서로 코어에만 서명합니다(README 참고).'
          }
          $hash = (Get-Content dist/SHA256SUMS.txt -First 1).Split(' ')[0]
          $rustc = rustc --version
          @(
            $match.Groups[1].Value.Trim()
            ''
            '## 설치'
            ''
            "1. 아래 Assets의 ``glide-windows-$env:VERSION.zip``을 받아 압축을 풉니다."
            '2. 압축을 푼 폴더의 `install.cmd`를 실행합니다(UAC 확인 1회).'
            '3. 제거는 설정 → 앱 → 설치된 앱의 **Glide for Windows** 또는 같은 폴더의 `uninstall.cmd`입니다.'
            ''
            '## 빌드 정보'
            ''
            "- 커밋: ``$env:GITHUB_SHA``"
            "- 컴파일러: ``$rustc``"
            "- 코드 서명: $signing"
            "- SHA-256(zip): ``$hash``"
          ) -join "`n" | Set-Content -LiteralPath release-notes.md -Encoding utf8

      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist/glide-windows-$env:VERSION.zip" dist/SHA256SUMS.txt `
            --title "Glide for Windows $env:VERSION" --notes-file release-notes.md --verify-tag
          if ($LASTEXITCODE -ne 0) { exit 1 }
