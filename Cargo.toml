# 코어(이 패키지)와 설정 창(settings/)이 한 작업 공간에서 target 폴더를 함께 쓴다.
# 그래서 두 실행 파일이 같은 폴더(target\release)에 생기고, 서로를 "같은 폴더의 실행 파일"로 확인한다.
[workspace]
members = [".", "settings"]

[package]
name = "glide-core"
version = "0.5.6"
edition = "2024"
rust-version = "1.85"
description = "Glide for Windows: 모든 Windows 앱에서 쓰는 우클릭 마우스 제스처"
license = "MIT"
repository = "https://github.com/devbattery/windows-mouse-gesture"
publish = false

[lib]
name = "glide_core"
path = "src/lib.rs"

[[bin]]
name = "glide-core"
path = "src/main.rs"

[features]
# 관리자 권한 창에서도 동작하는 uiAccess 매니페스트를 넣는다(서명·Program Files 설치가 필요, build.rs 참고).
uiaccess = []

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# 훅·입력·창·트레이처럼 COM이 필요 없는 Win32 API
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # 실행 중인 앱 목록에서 가려진 창 빼기(src/apps.rs)
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # 새 버전 확인(Windows 내장 WinHTTP, src/win/update.rs)
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# COM 인터페이스: 오버레이 그리기(Direct2D·DirectWrite), 탐색기를 통한 실행(셸 디스패치)
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell",
] }
# Direct2D 좌표 타입(Vector2). windows 0.62가 쓰는 버전과 맞춘다.
windows-numerics = "0.3"

[build-dependencies]
# 코어 실행 파일에 버전 정보·아이콘 자원을 넣는다(설정 창의 tauri-build가 이미 쓰는 것과 같은 크레이트).
tauri-winres = "0.3"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
# 훅 콜백(extern "system")에서 패닉이 경계를 넘지 않도록 즉시 종료한다.
panic = "abort"
