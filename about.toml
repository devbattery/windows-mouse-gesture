# cargo-about 설정: 배포 zip의 THIRD-PARTY-NOTICES.txt(의존 라이브러리 라이선스 고지)를 만든다.
# tools/package.ps1이 `cargo about generate`로 실행한다. 템플릿은 tools/about.hbs.

# 배포하는 실행 파일의 대상만 본다(다른 운영체제 전용 의존성은 넣지 않는다).
targets = ["x86_64-pc-windows-msvc"]

# 빌드 스크립트·테스트에만 쓰는 크레이트는 실행 파일에 들어가지 않는다.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# 이 저장소의 크레이트(glide-core, glide-settings)는 LICENSE.txt로 따로 고지한다.
private = { ignore = true }

# 허용하는 라이선스(앞에 있을수록 우선 선택). 여기에 없는 라이선스만 쓰는 크레이트가 들어오면
# `--fail`로 패키지 만들기가 멈춘다. 지금 의존성이 실제로 쓰는 것만 두었다.
# 추가할 때는 OSI 승인과 배포 조건(고지·소스 공개 범위)을 확인한다.
# MPL-2.0은 파일 단위 약한 카피레프트로, 수정 없이 쓰는 경우 고지와 소스 위치 안내로 충분하다.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
